name: Secure MVP CI

on:
  push:
    branches: [feature/secure-gemini-mvp]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: secure-mvp-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      AI_ENABLED: 'false'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Verify source checksums
        run: node qa/verify-checksums.mjs
      - run: npm ci
      - run: npm test
      - run: npm run check
      - run: npm run test:runtime
      - run: npm audit
      - name: Verify checksums after tests
        run: node qa/verify-checksums.mjs
